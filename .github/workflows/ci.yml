name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  line-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest==9.2.0
      - name: Run line-limit tests
        run: python -m pytest scripts/tests
      - name: Check file lengths
        run: python scripts/check_file_lengths.py

  mac-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mac-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - run: ruff check
      - run: mypy app
      - run: pytest

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug
